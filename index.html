    <style>

            --team-color: #111827;
            --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; position: relative; }

        .source-text { position: fixed; bottom: 10px; left: 15px; font-size: 0.7rem; color: #9ca3af; z-index: 100; pointer-events: none; font-weight: 500; }

        .sidebar { width: 320px; background-color: var(--bg-panel); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 10; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-color); }
        .sidebar-header h1 { font-size: 1.2rem; font-weight: 800; cursor: pointer; }
        .sidebar-header h1 span { color: var(--team-color); transition: color 0.3s; }
        .search-bar { width: 100%; padding: 10px; margin-top: 15px; border: 1px solid var(--border-color); border-radius: 8px; outline: none; }
        .search-bar:focus { border-color: var(--team-color); }
        
        .team-list { flex: 1; overflow-y: auto; padding-bottom: 40px; }
        .team-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; cursor: pointer; border-bottom: 1px solid var(--bg-body); }
        .team-item:hover { background-color: var(--bg-hover); }
        .team-item.active { background-color: rgba(0,0,0,0.03); border-left: 4px solid var(--team-color); }
        .team-flag { width: 28px; border-radius: 2px; box-shadow: var(--shadow-sm); }
        .team-name { font-weight: 600; font-size: 0.95rem; }

        .main-content { flex: 1; overflow-y: auto; }
        .content-wrapper { padding: 40px; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 30px; }
        .back-btn { display: inline-flex; align-items: center; font-weight: 600; color: var(--team-color); cursor: pointer; padding: 8px 16px; background: rgba(0,0,0,0.05); border-radius: 8px; width: fit-content; border: none; }
        .back-btn:hover { background: rgba(0,0,0,0.1); }

        .page-header { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 20px; border-bottom: 2px solid var(--border-color); }
        .page-header h2 { font-size: 2.5rem; font-weight: 800; display: flex; align-items: center; gap: 15px; }
        .header-flag { height: 40px; border-radius: 4px; box-shadow: var(--shadow-md); }
        .badge { background-color: var(--team-color); color: white; padding: 6px 12px; border-radius: 6px; font-weight: 700; text-transform: uppercase; }

        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        
        .card { background-color: var(--bg-panel); padding: 25px; border-radius: 12px; box-shadow: var(--shadow-md); border: 1px solid var(--border-color); }
        .card-title { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; font-weight: 600; margin-bottom: 10px; }
        
        .stat-card { text-align: center; cursor: pointer; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-4px); border-color: var(--team-color); }
        .stat-card .value { font-size: 2.5rem; font-weight: 800; color: var(--team-color); }
        .stat-card .click-hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; opacity: 0; transition: opacity 0.2s; }
        .stat-card:hover .click-hint { opacity: 1; color: var(--team-color); }

        .card-clickable { cursor: pointer; transition: transform 0.2s, border-color 0.2s; position: relative; }
        .card-clickable:hover { transform: translateY(-4px); border-color: var(--team-color); }
        .card-clickable .click-hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; text-align: center; opacity: 0; transition: opacity 0.2s; }
        .card-clickable:hover .click-hint { opacity: 1; color: var(--team-color); }
        
        .list-container { background-color: var(--bg-panel); border-radius: 12px; box-shadow: var(--shadow-md); border: 1px solid var(--border-color); overflow: hidden; display: flex; flex-direction: column; }
        .list-header { padding: 15px 20px; background-color: var(--bg-hover); border-bottom: 1px solid var(--border-color); font-weight: 700; }
        .squad-list { overflow-y: auto; max-height: 420px; }
        
        .list-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border-color); }
        .player-row { cursor: pointer; transition: background 0.2s; }
        .player-row:hover { background-color: var(--bg-hover); border-left: 4px solid var(--team-color); padding-left: 16px; }
        .player-name { font-weight: 600; }
        .player-pos { font-size: 0.85rem; color: var(--text-muted); }
        .player-stat { font-weight: 700; color: var(--team-color); }

        .team-grid-card { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 25px; cursor: pointer; text-align: center; gap: 15px; }
        .team-grid-card:hover { border-color: var(--team-color); transform: translateY(-5px); box-shadow: var(--shadow-md); }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(17,24,39,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: var(--bg-panel); width: 520px; max-height: 80vh; border-radius: 12px; display: flex; flex-direction: column; }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { font-weight: 700; color: var(--team-color); }
        .close-btn { cursor: pointer; font-size: 1.5rem; color: var(--text-muted); border: none; background: transparent; }
        .modal-body { overflow-y: auto; flex: 1; padding: 0; }
    </style>
</head>

                    { id: 70, name: 'Alisson', pos: 'Gardien', goals: 0, assists: 0, matches: 4, radar: [88, 86, 86, 82, 55, 90] }
                ]
            },
            'POR': {
                id: 'POR', name: 'Portugal', flag: 'pt', color: '#800000', result: 'Quart de finale',
                stats: { matches: 5, goals: 12, conceded: 6 },
                matches: [
                    { stage: 'Groupe', opp: 'Ghana', score: '3 - 2', conceded: 2 },
                    { stage: 'Groupe', opp: 'Uruguay', score: '2 - 0', conceded: 0 },
                    { stage: 'Groupe', opp: 'Corée du Sud', score: '1 - 2', conceded: 2 },
                    { stage: '1/8 finale', opp: 'Suisse', score: '6 - 1', conceded: 1 },
                    { stage: '1/4 finale', opp: 'Maroc', score: '0 - 1', conceded: 1 }
                ],
                players: [
                    { id: 71, name: 'Gonçalo Ramos', pos: 'Attaquant', goals: 3, assists: 1, matches: 4, radar: [88, 74, 46, 84, 80, 78] },
                    { id: 72, name: 'Bruno Fernandes', pos: 'Milieu', goals: 2, assists: 3, matches: 4, radar: [86, 92, 65, 80, 84, 94] },
                    { id: 73, name: 'Rafael Leão', pos: 'Attaquant', goals: 2, assists: 0, matches: 5, radar: [86, 76, 35, 88, 93, 78] },
                    { id: 74, name: 'João Félix', pos: 'Attaquant', goals: 1, assists: 2, matches: 4, radar: [83, 85, 42, 74, 90, 88] },
                    { id: 75, name: 'Cristiano Ronaldo', pos: 'Attaquant', goals: 1, assists: 0, matches: 5, radar: [88, 76, 35, 82, 80, 78] },
                    { id: 76, name: 'Pepe', pos: 'Défenseur', goals: 1, assists: 0, matches: 4, radar: [55, 75, 93, 91, 55, 72] },
                    { id: 77, name: 'Raphaël Guerreiro', pos: 'Défenseur', goals: 1, assists: 2, matches: 4, radar: [74, 85, 78, 76, 82, 84] },
                    { id: 78, name: 'Ricardo Horta', pos: 'Attaquant', goals: 1, assists: 0, matches: 3, radar: [78, 75, 42, 75, 80, 76] },
                    { id: 79, name: 'Diogo Dalot', pos: 'Défenseur', goals: 0, assists: 2, matches: 3, radar: [65, 80, 82, 86, 80, 78] },
                    { id: 80, name: 'Diogo Costa', pos: 'Gardien', goals: 0, assists: 0, matches: 5, radar: [84, 82, 85, 80, 48, 88] }
                ]
            }
        };

        let currentChart = null; let selectedTeam = null; let selectedPlayer = null;
        const app = document.getElementById('app');

        function updateThemeColor(color) { document.documentElement.style.setProperty('--team-color', color || '#111827'); }

        function renderHome() {
            updateThemeColor('#111827');
            app.innerHTML = `
                <div class="content-wrapper">
                    <div class="page-header">
                        <div>
                            <h2>Coupe du Monde 2022 - Tableau de bord</h2>
                            <p style="color: var(--text-muted); margin-top: 5px;">Analyse officielle des 8 meilleures équipes du tournoi</p>
                        </div>
                    </div>
                    <div class="grid-4">
                        ${Object.values(teamsData).map(team => `
                            <div class="card team-grid-card" onclick="navigate('team', '${team.id}')">
                                <div class="card-title">${team.result}</div>
                                <img src="https://flagcdn.com/w80/${team.flag}.png" style="width: 60px; box-shadow: var(--shadow-sm); border-radius: 4px;">
                                <h3 style="font-size: 1.1rem;">${team.name}</h3>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            highlightSidebar(null);
        }

        function renderTeam(teamId) {
            selectedTeam = teamsData[teamId];
            updateThemeColor(selectedTeam.color);
            highlightSidebar(teamId);

            const totalAssists = selectedTeam.players.reduce((sum, p) => sum + p.assists, 0);

            app.innerHTML = `
                <div class="content-wrapper">
                    <button class="back-btn" onclick="navigate('home')">← Retour au tableau de bord</button>
                    <div class="page-header">
                        <h2><img src="https://flagcdn.com/w80/${selectedTeam.flag}.png" class="header-flag"> ${selectedTeam.name}</h2>
                        <span class="badge">${selectedTeam.result}</span>
                    </div>

                    <div class="grid-4">
                        <div class="card stat-card"><div class="card-title">Matchs joués</div><div class="value">${selectedTeam.stats.matches}</div><p class="click-hint">Total du tournoi</p></div>
                        <div class="card stat-card" onclick="showTeamScorers('${selectedTeam.id}')"><div class="card-title">Buts marqués</div><div class="value">${selectedTeam.stats.goals}</div><p class="click-hint">↑ Voir les buteurs</p></div>
                        <div class="card stat-card" onclick="showTeamAssists('${selectedTeam.id}')"><div class="card-title">Passes décisives</div><div class="value">${totalAssists}</div><p class="click-hint">↑ Voir les passeurs</p></div>
                        <div class="card stat-card" onclick="showTeamConceded('${selectedTeam.id}')"><div class="card-title">Buts encaissés</div><div class="value">${selectedTeam.stats.conceded}</div><p class="click-hint">↑ Voir contre qui</p></div>
                    </div>

                    <div class="grid-2">
                        <div class="list-container">
                            <div class="list-header">Effectif analysé (Sélection)</div>
                            <div class="squad-list">
                                ${selectedTeam.players.map(p => `
                                    <div class="list-row player-row" onclick="navigate('player', {t: '${teamId}', p:${p.id}})">
                                        <div><div class="player-name">${p.name}</div><div class="player-pos">${p.pos}</div></div>
                                        <div class="player-stat" style="color: var(--text-muted); font-size:0.8rem;">Voir le profil →</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div class="list-container">
                            <div class="list-header">Parcours de l'équipe (Officiel)</div>
                            <div class="squad-list">
                                ${selectedTeam.matches.map(m => `
                                    <div class="list-row">
                                        <span class="player-pos" style="width: 80px;">${m.stage}</span>
                                        <span class="player-name">vs ${m.opp}</span>
                                        <span class="player-stat">${m.score}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function renderPlayer(data) {
            selectedTeam = teamsData[data.t];
            selectedPlayer = selectedTeam.players.find(p => p.id === data.p);
            updateThemeColor(selectedTeam.color);

            const labels = selectedPlayer.pos === 'Gardien' ? 
                ['Arrêts', 'Relance', 'Sorties', 'Physique', 'Jeu pied', 'Réflexes'] : 
                ['Tir', 'Passe', 'Défense', 'Physique', 'Dribble', 'Vision'];

            setTimeout(() => {
                const ctx = document.getElementById('radar').getContext('2d');
                if (currentChart) currentChart.destroy();
                currentChart = new Chart(ctx, {
                    type: 'radar',
                    data: {
                        labels: labels,
                        datasets: [{ data: selectedPlayer.radar, backgroundColor: selectedTeam.color+'33', borderColor: selectedTeam.color, borderWidth: 2, fill: true }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, scales: { r: { ticks: { display: false, min: 0, max: 100 } } }, plugins: { legend: { display: false } } }
                });
            }, 50);

            app.innerHTML = `
                <div class="content-wrapper">
                    <button class="back-btn" onclick="navigate('team', '${selectedTeam.id}')">← Retour à l'équipe</button>
                    <div class="page-header">
                        <h2><img src="https://flagcdn.com/w80/${selectedTeam.flag}.png" class="header-flag" style="height:30px;"> ${selectedPlayer.name}</h2>
                        <span class="badge">${selectedPlayer.pos}</span>
                    </div>

                    <div class="grid-3">
                        <div class="card stat-card" onclick="showPlayerMatches()"><div class="card-title">Matchs joués</div><div class="value">${selectedPlayer.matches}</div><p class="click-hint">↑ Voir la liste</p></div>
                        <div class="card stat-card" onclick="showPlayerGoals()"><div class="card-title">Buts marqués</div><div class="value">${selectedPlayer.goals}</div><p class="click-hint">↑ Détails des buts</p></div>
                        <div class="card stat-card" onclick="showPlayerAssists()"><div class="card-title">Passes décisives</div><div class="value">${selectedPlayer.assists}</div><p class="click-hint">↑ Détails des passes</p></div>
                    </div>

                    <div class="grid-2">
                        <div class="card card-clickable" onclick="showPlayerAnalytics()">
                            <div class="card-title">Profil analytique</div>
                            <div style="height:300px;"><canvas id="radar"></canvas></div>
                            <p class="click-hint">↑ Cliquez pour voir toutes les statistiques détaillées</p>
                        </div>
                    </div>
                </div>`;
        }

        function navigate(view, data) {
            window.scrollTo(0, 0);
            if(view === 'home') renderHome();
            else if(view === 'team') renderTeam(data);
            else if(view === 'player') renderPlayer(data);
        }

        function renderSidebar() {
            const list = document.getElementById('sidebarList');
            list.innerHTML = Object.values(teamsData).map(t => `
                <div class="team-item" id="nav-${t.id}" onclick="navigate('team', '${t.id}')">
                    <img src="https://flagcdn.com/w40/${t.flag}.png" class="team-flag"> <span class="team-name">${t.name}</span>
                </div>
            `).join('');
        }

        function highlightSidebar(id) {
            document.querySelectorAll('.team-item').forEach(el => el.classList.remove('active'));
            if(id) {
                const el = document.getElementById(`nav-${id}`);
                if(el) el.classList.add('active');
            }
        }

        function openModal(title, html) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('dataModal').classList.add('active');
        }
        function closeModal() { document.getElementById('dataModal').classList.remove('active'); }
        document.getElementById('dataModal').addEventListener('click', function(e) { if(e.target === this) closeModal(); });

        function showTeamScorers(teamId) {
            const team = teamsData[teamId];
            const scorers = team.players.filter(p => p.goals > 0).sort((a, b) => b.goals - a.goals);
            let html = scorers.map(p => `<div class="list-row"><div><div class="player-name">${p.name}</div><div class="player-pos">${p.pos}</div></div><div class="player-stat" style="font-size: 1.2rem;">${p.goals} ⚽</div></div>`).join('');
            openModal(`Buteurs : ${team.name}`, html || '<div class="list-row">Aucun but marqué.</div>');
        }

        function showTeamAssists(teamId) {
            const team = teamsData[teamId];
            const assists = team.players.filter(p => p.assists > 0).sort((a, b) => b.assists - a.assists);
            let html = assists.map(p => `<div class="list-row"><div><div class="player-name">${p.name}</div><div class="player-pos">${p.pos}</div></div><div class="player-stat" style="font-size: 1.2rem;">${p.assists} 👟</div></div>`).join('');
            openModal(`Passeurs : ${team.name}`, html || '<div class="list-row">Aucune passe décisive.</div>');
        }

        function showTeamConceded(teamId) {
            const team = teamsData[teamId];
            const concededMatches = team.matches.filter(m => m.conceded > 0);
            let html = concededMatches.map(m => `
                <div class="list-row">
                    <div>
                        <div class="player-name">vs ${m.opp}</div>
                        <div class="player-pos">${m.stage} (Score : ${m.score})</div>
                    </div>
                    <div class="player-stat" style="color: #dc2626; font-size: 1.1rem;">${m.conceded} but${m.conceded > 1 ? 's' : ''} encaissé${m.conceded > 1 ? 's' : ''}</div>
                </div>
            `).join('');
            openModal(`Détail des buts encaissés : ${team.name}`, html || '<div class="list-row">Aucun but encaissé (Clean Sheet total).</div>');
        }

        function showPlayerMatches() {
            let html = selectedTeam.matches.slice(0, selectedPlayer.matches).map(m => `<div class="list-row"><div><div class="player-name">vs ${m.opp}</div><div class="player-pos">${m.stage}</div></div><div class="player-stat">${m.score}</div></div>`).join('');
            openModal(`Matchs joués par ${selectedPlayer.name}`, html || '<div class="list-row">Aucun match joué.</div>');
        }

        function showPlayerGoals() {
            if(selectedPlayer.goals === 0) return openModal(`Buts de ${selectedPlayer.name}`, '<div class="list-row">Aucun but marqué lors de la compétition.</div>');
            let html = Array.from({length: selectedPlayer.goals}).map((_, i) => `<div class="list-row"><div><div class="player-name">⚽ But #${i+1} validé</div><div class="player-pos">Coupe du Monde 2022</div></div></div>`).join('');
            openModal(`Buts de ${selectedPlayer.name}`, html);
        }

        function showPlayerAssists() {
            if(selectedPlayer.assists === 0) return openModal(`Passes D. de ${selectedPlayer.name}`, '<div class="list-row">Aucune passe décisive lors de la compétition.</div>');
            let html = Array.from({length: selectedPlayer.assists}).map((_, i) => `<div class="list-row"><div><div class="player-name">👟 Passe décisive #${i+1}</div><div class="player-pos">Coupe du Monde 2022</div></div></div>`).join('');
            openModal(`Passes D. de ${selectedPlayer.name}`, html);
        }

        function showPlayerAnalytics() {
            const labels = selectedPlayer.pos === 'Gardien' ? 
                ['Arrêts', 'Relance', 'Sorties', 'Physique', 'Jeu au pied', 'Réflexes'] : 
                ['Tir', 'Passe', 'Défense', 'Physique', 'Dribble', 'Vision'];
            
            let html = `
                <div style="padding: 15px 20px; background-color: var(--bg-hover); border-bottom: 1px solid var(--border-color);">
                    <p style="font-size: 0.85rem; color: var(--text-muted);">Indice d'impact calculé sur 100 à partir des rapports de performance FIFA/Opta.</p>
                </div>
            `;
            
            labels.forEach((label, idx) => {
                const score = selectedPlayer.radar[idx];
                html += `
                    <div class="list-row">
                        <div>
                            <div class="player-name">${label}</div>
                            <div class="player-pos">Percentile de performance</div>
                        </div>
                        <div class="player-stat" style="font-size: 1.15rem;">${score} / 100</div>
                    </div>
                `;
            });

            const avgScore = (selectedPlayer.radar.reduce((a, b) => a + b, 0) / 6).toFixed(1);
            html += `
                <div class="list-row" style="background-color: rgba(0,0,0,0.02); font-weight: 700;">
                    <div>
                        <div class="player-name">Score Global Moyen</div>
                        <div class="player-pos">Synthèse décisionnelle</div>
                    </div>
                    <div class="player-stat" style="font-size: 1.3rem;">${avgScore} / 100</div>
                </div>
            `;

            openModal(`Statistiques Détaillées : ${selectedPlayer.name}`, html);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const filter = e.target.value.toLowerCase();
            document.querySelectorAll('.team-item').forEach(el => {
                const name = el.querySelector('.team-name').innerText.toLowerCase();
                el.style.display = name.includes(filter) ? 'flex' : 'none';
            });
        });

        renderSidebar();
        navigate('home');
    </script>
</body>
</html>
